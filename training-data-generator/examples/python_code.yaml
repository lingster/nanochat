          max_changes: 500
          languages: ["py"]
          exclude_authors: ["dependabot", "dependabot[bot]"]
          max_prs_per_repo: 60

      # GUI Frameworks
      - type: "github_pr"
        repositories:
          - "PySimpleGUI/PySimpleGUI"
          - "kivy/kivy"
