# Python Code Examples from GitHub PRs Configuration
# Extract high-quality Python code examples from popular repositories
version: "1.0"

# Global settings
global:
  output_dir: "./output/python_data"
  cache_dir: "./.cache/python"
  log_level: "INFO"

# Authentication
auth:
  github_token: "${GITHUB_TOKEN}"  # Set GITHUB_TOKEN environment variable

# Jobs
jobs:
  # Extract code examples from popular Python repositories
  - name: "python_github_code_examples"
    type: "jsonl_code"
    output_file: "python_code_examples.jsonl"

    sources:
      # Core Python & Standard Library
      - type: "github_pr"
        repositories:
          - "python/cpython"
          - "python/mypy"
          - "python/typeshed"
        options:
          state: "closed"
          merged_only: true
          date_from: "2024-01-01"
          date_to: "2026-01-24"
          min_commits: 1
          max_commits: 10
          min_changes: 10
          max_changes: 500
          languages: ["py", "python"]
          exclude_authors: ["dependabot", "dependabot[bot]", "github-actions[bot]"]
          include_diff: true
          max_prs_per_repo: 100

      # Web Frameworks
      - type: "github_pr"
        repositories:
          - "pallets/flask"
          - "django/django"
          - "fastapi/fastapi"
          - "encode/starlette"
          - "tornadoweb/tornado"
          - "bottlepy/bottle"
          - "cherrypy/cherrypy"
          - "tiangolo/fastapi"
        options:
          state: "closed"
          merged_only: true
          date_from: "2024-01-01"
          min_commits: 1
          max_commits: 10
          min_changes: 10
          max_changes: 500
          languages: ["py"]
          exclude_authors: ["dependabot", "dependabot[bot]", "github-actions[bot]"]
          max_prs_per_repo: 150

      # HTTP & Networking
      - type: "github_pr"
        repositories:
          - "psf/requests"
          - "encode/httpx"
          - "aio-libs/aiohttp"
          - "python-trio/trio"
