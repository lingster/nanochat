          state: "closed"
          merged_only: true
          date_from: "2024-01-01"
          min_commits: 1
          max_commits: 10
          min_changes: 10
          max_changes: 500
          languages: ["py"]
          exclude_authors: ["dependabot", "dependabot[bot]"]
          max_prs_per_repo: 100

      # Data Science & ML Core
      - type: "github_pr"
        repositories:
          - "numpy/numpy"
          - "pandas-dev/pandas"
          - "scikit-learn/scikit-learn"
          - "scipy/scipy"
          - "matplotlib/matplotlib"
          - "mwaskom/seaborn"
