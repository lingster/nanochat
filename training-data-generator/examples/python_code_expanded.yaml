# Python Code Examples from GitHub PRs - EXPANDED Configuration
# This is an EXPANDED version designed for collecting LARGE datasets (15-25GB+)
# Compared to python_code.yaml, this configuration:
# - Increases max_prs_per_repo from 100-150 to 3000-5000 per repo
# - Extends date range back to 2020-01-01 (vs 2024-01-01)
# - Adds 50+ more popular Python repositories across diverse categories
# - Maintains the same quality filters (merged PRs, commit/change limits, bot exclusion)
#
# Expected output: 15-25GB of high-quality Python code examples from real-world PRs
version: "1.0"

# Global settings
global:
  output_dir: "/mnt/archive/nanochat"
  cache_dir: "/mnt/archive/nanochat/.cache"
  log_level: "INFO"

# Authentication
auth:
  github_token: "${GITHUB_TOKEN}"  # Set GITHUB_TOKEN environment variable

# Jobs
jobs:
  # Extract code examples from popular Python repositories
  - name: "python_github_code_examples_expanded"
    type: "jsonl_code"
    output_file: "python_code_examples_expanded.jsonl"

    sources:
      # Core Python & Standard Library
      - type: "github_pr"
        repositories:
          - "python/cpython"
          - "python/mypy"
          - "python/typeshed"
          - "python/typing"
          - "python/peps"
        options:
          state: "closed"
          merged_only: true
          date_from: "2020-01-01"
          date_to: "2026-01-24"
          min_commits: 1
          max_commits: 10
          min_changes: 10
          max_changes: 500
          languages: ["py", "python"]
          exclude_authors: ["dependabot", "dependabot[bot]", "github-actions[bot]"]
          include_diff: true
          max_prs_per_repo: 5000

      # Web Frameworks
