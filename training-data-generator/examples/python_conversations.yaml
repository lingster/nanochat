# Python Q&A Conversation Data Configuration
# Extract Q&A pairs from Python documentation and tutorial sites
# Extended with 100+ FAQ sources for comprehensive training data
version: "1.0"

# Global settings
global:
  output_dir: "./output/python_data"
  cache_dir: "./.cache/python"
  log_level: "INFO"
  num_workers: 4

# Jobs
